version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aseguradora-postgres-db
    environment:
      POSTGRES_DB: aseguradora_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_admin_pass
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aseguradora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./app
    container_name: aseguradora-web-lab
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-aseguradora_db}
      - APP_OVERPRIVILEGED_PASS=${APP_OVERPRIVILEGED_PASS:-password_vulnerable_123}
      - APP_LEAST_PRIVILEGE_PASS=${APP_LEAST_PRIVILEGE_PASS:-password_secure_456}
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - ./test_exploit.py:/app/test_exploit.py:ro
    depends_on:
      db:
        condition: service_healthy
